version: '3.8'

services:
  bastiao:
    build: .
    container_name: bastiao-autodidata
    profiles: ["agent"]
    env_file:
      - .env
    environment:
      BASTIAO_WORKSPACE: /workspace/target
      OMNIROUTE_URL: http://ollama:11434/v1
      BASTIAO_MEMORY_LIMIT_MB: ${BASTIAO_MEMORY_LIMIT_MB:-2048}
      BASTIAO_CPU_LIMIT_SECONDS: ${BASTIAO_CPU_LIMIT_SECONDS:-45}
    mem_limit: ${BASTIAO_CONTAINER_MEMORY_LIMIT:-4g}
    cpus: ${BASTIAO_CONTAINER_CPUS:-2.0}
    pids_limit: ${BASTIAO_CONTAINER_PIDS_LIMIT:-256}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=536870912,mode=1777
    volumes:
      - ./workspace:/workspace/target
      - ./state:/var/lib/bastiao
    depends_on:
      - ollama
    restart: on-failure:3

  ollama:
    image: ollama/ollama:latest
    container_name: bastiao-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: bastiao-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  ollama_data:
  chroma_data:
